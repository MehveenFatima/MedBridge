spring.application.name=medbridge

# ---------------------------------------------------------------
# Database: MySQL 8 (default)
# createDatabaseIfNotExist creates the "medbridge" schema on first run.
# Set DB_USERNAME / DB_PASSWORD as environment variables, or edit the defaults.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/medbridge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update: Hibernate creates/alters tables to match the entities.
#   Fine for development; production would use Flyway or Liquibase migrations.
# open-in-view=false: the database session closes when the service method ends,
#   so all mapping to DTOs happens inside the service layer.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql (seeds the three source systems) AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------
# Uploads and paging
# ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------
# Swagger UI -> http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

server.port=8080
logging.level.com.medbridge=INFO
