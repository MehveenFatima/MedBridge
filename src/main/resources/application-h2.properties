# ---------------------------------------------------------------
# Optional profile: run without MySQL, using an in-memory H2 database.
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data is lost when the app stops. The tests also use this profile.
# H2 console: http://localhost:8080/h2-console  (JDBC URL below, user "sa", no password)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:medbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
